<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="../css/reviews.css">
</head>

<body>
    
<h1>Reviews Test</h1>
<div class="container">
<div class="headeryu">
     <h1> 💬Comment <span id="Display-comment">0</span></h1>
        <div class="sort-options"> </div>
    </div>

    <details class="write-details">
      <summary>
        <span class="write-btn">+ Write comment</span>
      </summary>
       <form class="write-form">
        <div class="form-row">
          <div class="form-field">
            <label for="nickname">Name</label>
            <input type="text" id="nickname" placeholder="Your nickname" maxlength="20">
          </div>
          <div class="form-field">
            <label for="source">Source/Media</label>
            <input type="text" id="source" placeholder="Location...Country...City..." maxlength="30">
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="score">Score</label>
            <select id="score">
              <option value="A+">A+</option>
              <option value="A" >A</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B">B</option>
              <option value="B-">B-</option>
              <option value="C+">C+</option>
              <option value="C">C</option>
              <option value="C-">C-</option>
              <option value="D+">D+</option>
              <option value="D" >D</option>
              <option value="D-">D-</option>
              <option value="F">F</option>
              <option value="none" selected>None</option>
            </select>
          </div>
          <div class="form-field">
            <label for="avatarColor">Avatarcolor</label>
            <select id="avatarColor">
              <option value="gray">Grey</option>
              <option value="red">Red</option>
              <option value="blue" selected>Blue</option>
              <option value="green">Green</option>
              <option value="purple">Purple</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="reviewText">Content</label>
            <textarea id="reviewText" placeholder="Write your comment..." maxlength="300"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="reset" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-submit">Post a comment</button>
        </div>
      </form>
    </details>

   
  </div>
</div>

<script src="../js/movies.js"></script>

</body>
</html>
